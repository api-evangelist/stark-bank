- aid: stark-bank:stark-bank-pix-key-api
  name: Stark Bank Pix Key API
  description: >-
    The Pix keys are saved in the DICT (Diretório de Identificadores de Contas Transacionais), the centralized
    Pix service managed by Bacen (Brazilian Central Bank) that allows you to search for transactional
    accounts with convenient addressing keys.

    The types of keys currently available are CPF, CNPJ, phone number, e-mail and EVP (random UUID). In
    this section, we will teach you how to manage DICT keys.

    Note: Whenever a Workspace is created, an EVP (random) DICT key is created and associated with it.
    This is done in order to ensure the safety of the Invoice service, since it requires an active DICT
    Key to work.
  humanURL: https://docs.starkbank.com/api
  baseURL: https://api.starkbank.com
  tags:

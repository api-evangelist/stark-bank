- aid: stark-bank:stark-bank-webhook-api
  name: Stark Bank Webhook API
  description: >-
    You can create webhook subscriptions to receive events whenever a new log is created. We send the
    event by making a POST request to your endpoint URL. The event will be delivered with a digital signature
    (headers["Digital-Signature"]), which can be verified using the Stark Bank public key. This key is
    recoverable by a GET request to /v2/public-key.

    If your endpoint URL does not return a 200 status, the webhook service will try again at most three
    times. The interval between each attempt is 5 min, 30 min and finally 120 min. In case the event cannot
    be delivered after those three attempts, we will stop trying to deliver the message.

    The event sent to the endpoint URL has the structure shown to the right, where the content of the
    log sent will depend on the event subscription.

    NOTE 1: Registered webhooks will only work for services used in that same version. For example, if
    you create a transfer in v2, its logs will only trigger v2 webhooks and v1 webhooks would ignore its
    events.

    NOTE 2: Even if you use Webhook, we strongly recommend that you create a daily task to get all undelivered
    events and set them as delivered. It's important to add redundancy and resilience to your system,
    preventing you from having outdated information just in case your system is temporarily unable to
    receive our Webhook events.
  humanURL: https://docs.starkbank.com/api
  baseURL: https://api.starkbank.com
  tags:
  - Webhook
  properties:
  - type: OpenAPI
    url: openapi/stark-bank-webhook-api-openapi.yml
  - type: Postman
    url: postman/stark-bank-postman.json
  - type: Authentication

  name: Stark Bank Invoice Pull Request API
  description: >-
    An Invoice Pull Request is a command sent to the payer's bank to trigger the automatic debit of a
    previously issued invoice linked to an active Invoice Pull Subscription. It confirms the receiver's
    intent to collect the agreed amount within the current billing cycle and initiates the settlement
    process through the Pix infrastructure.

    You can use asynchronous webhooks to monitor status changes.

- aid: stark-bank:stark-bank-invoice-api
  name: Stark Bank Invoice API
  description: >-
    The Invoice resource is used to request payments from customers.

    Your customer can pay it by scanning the Pix QR Code or making a deposit to the indicated account
    number.

    You can set custom fields as fine, interest, overdue date and expiration date, for a complete charge
    method, much better than boleto.

    If you're used to our Boleto resource, you will feel pretty familiar with the Invoice flow. In this
    section, we will teach you how to create and manage your Pix invoices.

    You can also split the Invoice between different receivers, you need to create a Split Receiver, and
    add the receiver into the Splits array.
  humanURL: https://docs.starkbank.com/api
  baseURL: https://api.starkbank.com

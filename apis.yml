- aid: stark-bank:stark-bank-invoice-pull-subscription-api
  name: Stark Bank Invoice Pull Subscription API
  description: >-
    An Invoice Pull Subscription is a recurring payment agreement between a payer and a receiver, authorized
    through the Pix Automatic infrastructure. Once active, it allows the receiver to periodically trigger
    automatic debits by issuing invoices that match the agreed conditions such as amount, frequency, and
    billing cycle without requiring new consent for each transaction.

    You can use asynchronous webhooks to monitor status changes.

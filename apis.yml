- aid: stark-bank:stark-bank-event-api
  name: Stark Bank Event API
  description: >-
    Every time a log is created, a corresponding event will be generated and sent to you by webhook, if
    the appropriate subscription was set. Therefore, the event represents an occurrence in your workspace.

    NOTE: All the events have a log property containing an entity log. The nature of the log, however,
    may change according to the subscription that triggered the event. For example, if the subscription
    is transfer, the log in the event will be a TransferLog. If the subscription is boleto, the log in
    the event will be a BoletoLog, and so on.

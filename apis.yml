aid: stark-bank
name: Stark Bank
description: >-
  Stark Bank is a regulated Brazilian financial institution (authorized by the Banco
  Central do Brasil, not a payment service provider) that exposes end-to-end money
  movement through a single RESTful JSON API. Businesses collect money with Pix
  Invoices, Pix QR codes, Pix subscriptions, Boletos, card payments and marketplace
  split receivables, and pay out with Pix/TED Transfers, Boleto, BR Code, utility,
  tax and DARF payments plus approval-gated Payment Requests. Received funds land
  directly in the account balance with no wallet or payout step. The v2 OpenAPI 3.1
  API (143 operations) authenticates with ECDSA request signing rather than API keys
  or OAuth, offers a production-identical sandbox, cursor pagination, externalId
  idempotency and signed webhook events, and ships nine official SDKs (Python, Node,
  Go, Java, Ruby, PHP, .NET, Elixir, Clojure).

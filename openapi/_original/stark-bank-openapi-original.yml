                  type: integer
                  description: 'Fixed amount due in cents for fines. Example: 234 (= R$ 2.34)'
                interestAmount:
                  type: integer
                  description: 'Amount due in cents for interest. Example: 456 (= R$ 4.56)'
                nominalAmount:
                  type: integer
                  description: 'Amount due in cents without fee or interest. Example: 23456 (= R$ 234.56)'
                revenueCode:
                  type: string
                  description: '4-digit tax code assigned by Federal Revenue. Example: "5948"'
                taxId:
                  type: string
                  description: 'Payer CPF (11 digits formatted or unformatted) or CNPJ (14 digits formatted or unformatted). Example: 012.345.678-90'
                referenceNumber:
                  type: string
                  description: 'Number assigned to the region of the tax. Example: "08.1.17.00-4"'
                scheduled:
                  type: string
                  format: date-time
                  description: Schedule the payment for a specific date. Default value is the current day.
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of strings to tag the entity for future queries. All tags will be converted to lowercase.
              required:
